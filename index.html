<style>
:root{--bg:#fff;--bg2:#f7f8fa;--bg3:#f0f2f5;--surface:#fff;--surface2:#f9fafb;--text:#1a1d23;--text2:#44546f;--text3:#8993a4;--border:#e2e5e9;--border-light:#eef0f3;--primary:#0052CC;--primary-dark:#003d99;--primary-light:#deebff;--primary-bg:#e6f0ff;--success:#00875a;--success-bg:#e3fcef;--error:#de350b;--error-bg:#ffebe6;--warning:#ff991f;--warning-bg:#fffae6;--purple:#6554c0;--purple-bg:#eae6ff;--teal:#00b8d9;--teal-bg:#e6fcff;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--mono:'SF Mono',Consolas,monospace;--radius:10px;--radius-sm:6px;--shadow:0 1px 3px rgba(0,0,0,.05);--shadow-md:0 4px 12px rgba(0,0,0,.08)}

*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--font);background:var(--bg);color:var(--text);transition:background .3s,color .3s}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-logo{width:36px;height:36px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.hdr h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
.hdr-meta{display:flex;gap:12px;margin-top:2px;font-size:11px;color:var(--text3)}.hdr-meta span{display:flex;align-items:center;gap:4px}
.hdr-right{display:flex;align-items:center;gap:10px}
.date-sel{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:var(--radius-sm);font-size:12px;font-family:var(--font);cursor:pointer}
.live-dot{width:7px;height:7px;background:var(--success);border-radius:50%;display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.badge{background:var(--bg2);color:var(--text2);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;display:flex;align-items:center;gap:4px}
.theme-btn{background:none;border:1px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}.theme-btn:hover{background:var(--bg2);color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:16px 24px}
.kpi{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpi-lbl{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px;margin-bottom:6px;font-weight:500}
.kpi-val{font-size:24px;font-weight:800;font-family:var(--mono);line-height:1.1}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:3px}
.kpi.blue .kpi-val{color:var(--primary)}.kpi.red .kpi-val{color:var(--error)}.kpi.green .kpi-val{color:var(--success)}.kpi.orange .kpi-val{color:var(--warning)}.kpi.purple .kpi-val{color:var(--purple)}.kpi.teal .kpi-val{color:var(--teal)}
.tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:0;overflow-x:auto}
.tab-btn{background:none;border:none;padding:10px 14px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap;font-family:var(--font);transition:all .2s}.tab-btn:hover{color:var(--text2)}.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-btn .cnt{background:var(--primary-bg);color:var(--primary);padding:1px 6px;border-radius:10px;font-size:10px;font-weight:700}
.tab-btn.admin{margin-left:auto;opacity:.55}.tab-btn.admin.active{opacity:1}
.content{max-width:1380px;margin:0 auto;padding:16px 24px}.tab-pane{display:none}.tab-pane.active{display:block}

    {l:'Total Open',v:total,s:'Current queue',c:'blue',ic:'fa-ticket'},
    {l:'Resolved Today',v:D.resolved||0,s:'Closed this day',c:'green',ic:'fa-check-circle'},
    {l:'New Today',v:D.new_count||0,s:'Created this day',c:'orange',ic:'fa-plus-circle'},

function filterAll(){

}

function loadPriority(){
  var raw=document.getElementById('priInput').value.trim();if(!raw)return;
  var ids=raw.match(/[A-Z0-9]{5,}/gi)||[];if(!ids.length)return;
  PRI_IDS=ids;try{localStorage.setItem('nonblma_pri',raw)}catch(e){}
  var pool=ALL_TICKETS.length?ALL_TICKETS:(D.w2a_list||[]).map(normalizeTicket);
  if(!pool.length){document.getElementById('priKpis').innerHTML='<div class="kpi orange" style="grid-column:1/-1"><div class="kpi-sub">Upload data in Admin or select a date first.</div></div>';return}
  var map={};pool.forEach(function(t){map[t.id.toUpperCase()]=t});
  var matched=[],unmatched=[],seen={};
  ids.forEach(function(id){var u=id.toUpperCase();if(seen[u])return;seen[u]=1;var t=map[u];if(t)matched.push(t);else unmatched.push(id)});
  PRI_MATCHED=matched;try{document.getElementById('pCnt').textContent=matched.length}catch(e){}
  var pA=0,pW=0,pOld=0;matched.forEach(function(t){if(t.status==='Assigned')pA++;if(t.status==='Work In Progress')pW++;if(t.age>7)pOld++});
  var kpis=[{l:'Total Priority',v:matched.length,s:unmatched.length+' not found',c:'blue',ic:'fa-fire'},{l:'Untouched',v:pA,s:'Still Assigned',c:'red',ic:'fa-circle-xmark'},{l:'In Progress',v:pW,s:'Being worked',c:'orange',ic:'fa-spinner'},{l:'Aged > 7 Days',v:pOld,s:'Need attention',c:'purple',ic:'fa-hourglass'}];
  document.getElementById('priKpis').innerHTML=kpis.map(function(k){return '<div class="kpi '+k.c+'"><div class="kpi-lbl"><i class="fa-solid '+k.ic+'"></i> '+k.l+'</div><div class="kpi-val">'+k.v+'</div><div class="kpi-sub">'+k.s+'</div></div>'}).join('');
  var base=hcBase();var pbs={};matched.forEach(function(t){pbs[t.status]=(pbs[t.status]||0)+1});
  var scc={'Assigned':'#de350b','Work In Progress':'#ff991f','Pending':'#6554c0'};
  Highcharts.chart('c-pri-status',Highcharts.merge(base,{chart:{type:'pie'},plotOptions:{pie:{innerSize:'50%',dataLabels:{format:'<b>{point.name}</b>: {point.y}',style:{fontSize:'11px',textOutline:'none'}}}},series:[{data:Object.keys(pbs).map(function(k){return{name:k,y:pbs[k],color:scc[k]||'#999'}})}]}));
  var pb={'0-3':0,'4-7':0,'8-14':0,'15-30':0,'30+':0};matched.forEach(function(t){if(t.age<=3)pb['0-3']++;else if(t.age<=7)pb['4-7']++;else if(t.age<=14)pb['8-14']++;else if(t.age<=30)pb['15-30']++;else pb['30+']++});
  var ac=['#36b37e','#00b8d9','#ff991f','#ff5630','#de350b'];
  Highcharts.chart('c-pri-age',Highcharts.merge(base,{chart:{type:'column'},xAxis:{categories:Object.keys(pb)},yAxis:{title:{text:''}},legend:{enabled:false},plotOptions:{column:{dataLabels:{enabled:true},borderRadius:4}},series:[{data:Object.values(pb).map(function(v,i){return{y:v,color:ac[i]}})}]}));
  renderTable(matched,'pri-table',['id','severity','status','title','age','created']);
  document.getElementById('pri-warn').innerHTML=unmatched.length?'<div style="margin-top:8px;padding:10px;background:var(--warning-bg);border-radius:8px;font-size:12px"><b>\u26A0\uFE0F '+unmatched.length+' not found:</b> '+unmatched.join(', ')+'</div>':'';
}

function handleUpload(type,input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var rows=parseCSV(e.target.result);
    if(type==='start'){RAW_START=rows;document.getElementById('uz1').classList.add('loaded');document.getElementById('uz1').querySelector('p').textContent='\u2713 '+rows.length+' tickets'}
    else{RAW_END=rows;document.getElementById('uz2').classList.add('loaded');document.getElementById('uz2').querySelector('p').textContent='\u2713 '+rows.length+' tickets'}
    if(RAW_START&&RAW_END)buildFromUploads();
    else document.getElementById('uploadMsg').textContent='Upload the other dump to complete analysis.';
  };reader.readAsText(file);
}

function buildFromUploads(){
  var m=RAW_START,ev=RAW_END;var mMap={},eMap={};
  m.forEach(function(r){mMap[r.IssueId]=r});ev.forEach(function(r){eMap[r.IssueId]=r});
  var resolved=[],newT=[],w2a=[],a2w=[];
  for(var id in mMap)if(!eMap[id])resolved.push(normalizeTicket(mMap[id]));
  for(var id in eMap)if(!mMap[id])newT.push(normalizeTicket(eMap[id]));
  for(var id in eMap){if(mMap[id]&&mMap[id].Status!==eMap[id].Status){if(mMap[id].Status==='Work In Progress'&&eMap[id].Status==='Assigned')w2a.push(normalizeTicket(eMap[id]));if(mMap[id].Status==='Assigned'&&eMap[id].Status==='Work In Progress')a2w.push(normalizeTicket(eMap[id]))}}
  ALL_TICKETS=ev.map(normalizeTicket);
  var rWip=0,rAss=0;resolved.forEach(function(t){if(t.status==='Work In Progress')rWip++;else if(t.status==='Assigned')rAss++});
  var cnt=function(arr,k){var m={};arr.forEach(function(t){var v=String(t[k]||'?');m[v]=(m[v]||0)+1});return m};
  var ageBuckets=function(arr){var b={'0-3d':0,'4-7d':0,'8-14d':0,'15-30d':0,'30+d':0};arr.forEach(function(t){var a=t.age;if(a<=3)b['0-3d']++;else if(a<=7)b['4-7d']++;else if(a<=14)b['8-14d']++;else if(a<=30)b['15-30d']++;else b['30+d']++});return b};
  var wip=ALL_TICKETS.filter(function(t){return t.status==='Work In Progress'});
  var wipAvg=0;if(wip.length){var s=0;wip.forEach(function(t){s+=t.age});wipAvg=Math.round(s/wip.length*10)/10}
  var wkMap={};ALL_TICKETS.forEach(function(t){if(t.created){try{var d=new Date(t.created);var ws=new Date(d);ws.setDate(d.getDate()-d.getDay());var k=(ws.getMonth()+1)+'/'+ws.getDate();wkMap[k]=(wkMap[k]||0)+1}catch(e){}}});
  var diMap={};ALL_TICKETS.forEach(function(t){if(t.created)diMap[t.created]=(diMap[t.created]||0)+1});
  var diSorted={};Object.keys(diMap).sort().slice(-14).forEach(function(k){diSorted[k]=diMap[k]});

  D={date:new Date().toISOString().slice(0,10),total:ev.length,morning_total:m.length,resolved:resolved.length,new_count:newT.length,net:ev.length-m.length,
    resolved_wip:rWip,resolved_assigned:rAss,wip_to_assigned_count:w2a.length,assigned_to_wip_count:a2w.length,
    by_status:cnt(ALL_TICKETS,'status'),by_severity:cnt(ALL_TICKETS,'severity'),m_status:cnt(m.map(normalizeTicket),'status'),
    age_buckets:ageBuckets(ALL_TICKETS),weekly_inflow:wkMap,daily_inflow:diSorted,
    wip_count:wip.length,wip_avg_age:wipAvg,wip_ages:ageBuckets(wip),wip_severity:cnt(wip.map(function(t){return{severity:String(t.severity)}}),'severity'),
    w2a_count:w2a.length,w2a_list:w2a,tickets:ALL_TICKETS,resolved_list:resolved,new_list:newT,priorityIds:PRI_IDS};

  try{var snap={date:D.date,total:D.total,by_status:D.by_status};HISTORY.unshift(snap);if(HISTORY.length>30)HISTORY=HISTORY.slice(0,30);localStorage.setItem('nonblma_hist',JSON.stringify(HISTORY))}catch(e){}
  document.getElementById('exportBtn').disabled=false;
  document.getElementById('uploadMsg').innerHTML='<span style="color:var(--success)">\u2705 Analysis ready! <b>'+ev.length+'</b> tickets loaded.</span>';
  renderAll();if(document.getElementById('priInput').value.trim())loadPriority();
}

function exportJSON(){
  if(!D)return;D.priorityIds=PRI_IDS;
  var out={date:D.date,summary:{total:D.total,morning_total:D.morning_total,resolved:D.resolved,new_count:D.new_count,net:D.net,resolved_wip:D.resolved_wip,resolved_assigned:D.resolved_assigned,wip_to_assigned_count:D.wip_to_assigned_count,assigned_to_wip_count:D.assigned_to_wip_count,e_status:D.by_status,e_severity:D.by_severity,m_status:D.m_status,age_buckets:D.age_buckets,weekly_inflow:D.weekly_inflow,daily_inflow:D.daily_inflow,wip_count:D.wip_count,wip_avg_age:D.wip_avg_age,wip_ages:D.wip_ages,wip_severity:D.wip_severity},tickets:ALL_TICKETS,wip_to_assigned:D.w2a_list,resolved_list:D.resolved_list,new_list:D.new_list,priorityIds:PRI_IDS};
  var blob=new Blob([JSON.stringify(out)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=D.date+'.json';a.click();
  document.getElementById('exportMsg').textContent='\u2713 Saved as '+D.date+'.json';

function normalizeTicket(t){return{id:t.ShortId||t.id||'',url:t.IssueUrl||t.url||'',title:(t.Title||t.title||'').substring(0,120),severity:parseInt(t.Severity||t.severity)||5,status:t.Status||t.status||'Assigned',age:parseInt(t.Age||t.age)||0,asin:t.Asin||t.asin||'',upc:t.UPC||t.upc||'',created:(t.CreateDate||t.created||'').substring(0,10),last_updated:(t.LastUpdatedDate||t.last_updated||'').substring(0,10),assignee:t.AssigneeIdentity||t.assignee||''}}

function renderTable(rows,targetId,cols){
  var labels={id:'Ticket ID',severity:'Sev',status:'Status',title:'Title',asin:'ASIN',age:'Age',created:'Created'};
  var h='<table class="dt"><thead><tr>';cols.forEach(function(c){h+='<th>'+labels[c]+'</th>'});h+='</tr></thead><tbody>';
  rows.forEach(function(t){h+='<tr>';cols.forEach(function(c){var v=t[c]||'';if(c==='id')h+='<td><a href="'+(t.url||'https://t.corp.amazon.com/'+v)+'" target="_blank">'+v+'</a></td>';else if(c==='severity')h+='<td><span class="sev'+v+'">Sev '+v+'</span></td>';else if(c==='status')h+='<td><span class="'+(v==='Assigned'?'st-a':v==='Work In Progress'?'st-w':'st-p')+'">'+v+'</span></td>';else if(c==='title')h+='<td title="'+v+'">'+v.substring(0,75)+'</td>';else if(c==='age')h+='<td>'+v+'d</td>';else h+='<td>'+v+'</td>'});h+='</tr>'});
  if(!rows.length)h+='<tr><td colspan="'+cols.length+'" style="text-align:center;padding:30px;color:var(--text3)">No tickets</td></tr>';
  h+='</tbody></table>';document.getElementById(targetId).innerHTML=h;
}

function parseCSV(text){var lines=text.split('\n');var hdr=csvLine(lines[0]);var rows=[];for(var i=1;i<lines.length;i++){if(!lines[i].trim())continue;var v=csvLine(lines[i]);var o={};for(var j=0;j<hdr.length;j++)o[hdr[j]]=(v[j]||'').trim();rows.push(o)}return rows}
function csvLine(l){var r=[],c='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(q){if(ch==='"'){if(i+1<l.length&&l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else{if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else c+=ch}}r.push(c);return r}

function dlCSVData(data,name){if(!data||!data.length){alert('No data');return}var k=Object.keys(data[0]);var csv=k.join(',')+'\n';data.forEach(function(r){var row=[];k.forEach(function(c){row.push('"'+String(r[c]||'').replace(/"/g,'""')+'"')});csv+=row.join(',')+'\n'});var b=new Blob([csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}
function dlAll(){dlCSVData(ALL_TICKETS,'full_queue.csv')}
function dlWip(){dlCSVData(getWipFiltered(),'wip_tickets.csv')}
function dlAssigned(){dlCSVData(ALL_TICKETS.filter(function(t){return t.status==='Assigned'}),'assigned.csv')}
function dlResolved(){dlCSVData(D.resolved_list||[],'resolved.csv')}
function dlNew(){dlCSVData(D.new_list||[],'new_today.csv')}
function dlW2A(){dlCSVData(D.w2a_list||[],'wip_to_assigned.csv')}
function dlPri(){dlCSVData(PRI_MATCHED,'priority.csv')}

function tryAutoLoad(){
  fetch('./data/manifest.json').then(function(r){if(!r.ok)throw '';return r.json()}).then(function(dates){
    var sel=document.getElementById('dateSelect');dates.sort().reverse();
    dates.forEach(function(d){var o=document.createElement('option');o.value=d;o.textContent=fmtDateLabel(d);sel.appendChild(o)});
    if(dates.length){sel.value=dates[0];loadDate(dates[0])}
  }).catch(function(){});
}
function loadDate(ds){
  if(!ds)return;
  fetch('./data/'+ds+'.json').then(function(r){if(!r.ok)throw '';return r.json()}).then(function(data){
    if(data.summary){var S=data.summary;D={date:data.date,total:S.total,morning_total:S.morning_total,resolved:S.resolved,new_count:S.new_count,net:S.net,resolved_wip:S.resolved_wip,resolved_assigned:S.resolved_assigned,wip_to_assigned_count:S.wip_to_assigned_count,assigned_to_wip_count:S.assigned_to_wip_count,by_status:S.e_status,by_severity:S.e_severity,m_status:S.m_status,age_buckets:S.age_buckets,weekly_inflow:S.weekly_inflow,daily_inflow:S.daily_inflow||{},wip_count:S.wip_count,wip_avg_age:S.wip_avg_age,wip_ages:S.wip_ages,wip_severity:S.wip_severity,w2a_count:S.wip_to_assigned_count,w2a_list:(data.wip_to_assigned||[]),resolved_list:data.resolved_list||[],new_list:data.new_list||[],priorityIds:data.priorityIds||[]}}else D=data;
    ALL_TICKETS=(data.tickets||[]).map(normalizeTicket);
    D.w2a_list=(D.w2a_list||data.wip_to_assigned||[]).map(normalizeTicket);
    D.resolved_list=(D.resolved_list||data.resolved_list||[]).map(normalizeTicket);
    D.new_list=(D.new_list||data.new_list||[]).map(normalizeTicket);
    if(data.priorityIds&&data.priorityIds.length){PRI_IDS=data.priorityIds;document.getElementById('priInput').value=PRI_IDS.join('\n')}
    renderAll();if(PRI_IDS.length)loadPriority();
  }).catch(function(){});
}
function fmtDateLabel(d){try{var p=d.split('-');var dt=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];var mos=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return days[dt.getDay()]+', '+mos[dt.getMonth()]+' '+dt.getDate()}catch(e){return d}}

// INIT
initTheme();
buildUI();
D=EMBEDDED;D.w2a_list=D.w2a_list||[];D.resolved_list=[];D.new_list=[];D.priorityIds=[];
renderAll();
tryAutoLoad();
try{var savedPri=localStorage.getItem('nonblma_pri');if(savedPri)document.getElementById('priInput').value=savedPri}catch(e){}
</script>
